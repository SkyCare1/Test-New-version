<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#75699a">
<title>Service Support Center — Offline</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#f4f5f8;color:#172033}.card{width:min(520px,calc(100% - 32px));padding:32px;border-radius:24px;background:#fff;box-shadow:0 18px 60px rgba(15,23,42,.16);text-align:center}.icon{width:88px;height:88px;border-radius:24px;margin:auto;display:block}.btn{display:inline-flex;margin-top:18px;padding:11px 18px;border:0;border-radius:999px;background:#75699a;color:#fff;font-weight:800;cursor:pointer}@media(prefers-color-scheme:dark){body{background:#111318;color:#f5f7fb}.card{background:#20242d;box-shadow:0 18px 60px rgba(0,0,0,.5)}}
</style>
</head>
<body>
<main class="card">
<img class="icon" src="icon-192.png" alt="">
<h1>You are offline</h1>
<p>The application shell is available, but live dashboard data and authentication require an internet connection.</p>
<button class="btn" onclick="location.reload()" type="button">Try Again</button>
</main>
</body>
</html>
